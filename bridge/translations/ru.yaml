configuration:
  auto_restart_ha:
    name: Перезапускать Home Assistant после установки/обновления интеграции
    description: >-
      При старте приложение копирует файлы интеграции в /config/custom_components.
      Чтобы Home Assistant их загрузил, нужен один перезапуск. Если включено, приложение
      сделает это само (только если файлы были установлены или изменены). Отключите,
      чтобы перезапускать вручную.
network:
  8787/tcp: Duck.ai bridge API (без авторизации, только LAN)
